NG trừ kho nguyên</tspan><tspan x="1010" y="1665.86">liệu;</tspan><tspan x="1010" y="1691.06">KHÔNG cộng điểm thưởng ở bước này;</tspan><tspan x="1010" y="1716.26">(Trừ kho &amp; tích điểm chỉ sau khi VNPay</tspan><tspan x="1010" y="1741.46">SUCCESS)</tspan></text></g></g><g class="drawio-vertex" data-cell-id="o_end"><ellipse fill="#FFFFFF" stroke="#111111" stroke-width="3" stroke-linejoin="round" cx="1010" cy="1810" rx="13" ry="13"/></g><g class="drawio-vertex" data-cell-id="o_end_dot"><ellipse fill="#111111" stroke="#111111" stroke-width="1" stroke-linejoin="round" cx="1010" cy="1810" rx="9" ry="9"/></g><g class="drawio-vertex" data-cell-id="branchLabel3"><rect fill="#FFFFFF" stroke="none" stroke-linejoin="round" x="718" y="525" width="104" height="32"/><g class="drawio-label"><text text-anchor="middle" font-size="18" font-weight="bold" fill="#111111"><tspan x="770" y="547.05">[Không]</tspan></text></g></g><g class="drawio-vertex" data-cell-id="branchLabel5"><rect fill="#FFFFFF" stroke="none" stroke-linejoin="round" x="1003" y="638.5" width="80" height="32"/><g class="drawio-label"><text text-anchor="middle" font-size="18" font-weight="bold" fill="#111111"><tspan x="1043" y="660.55">[Có]</tspan></text></g></g><g class="drawio-vertex" data-cell-id="branchLabel7"><rect fill="#FFFFFF" stroke="none" stroke-linejoin="round" x="688" y="875" width="104" height="32"/><g class="drawio-label"><text text-anchor="middle" font-size="18" font-weight="bold" fill="#111111"><tspan x="740" y="897.05">[Không]</tspan></text></g></g><g class="drawio-vertex" data-cell-id="branchLabel9"><rect fill="#FFFFFF" stroke="none" stroke-linejoin="round" x="1003" y="1005" width="80" height="32"/><g class="drawio-label"><text text-anchor="middle" font-size="18" font-weight="bold" fill="#111111"><tspan x="1043" y="1027.05">[Có]</tspan></text></g></g></svg>