 font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">VNPay Sandbox</text><rect x="1131" y="362" width="18" height="1986" fill="#ffffff" stroke="#111111" /><rect x="651" y="285" width="18" height="2140" fill="#ffffff" stroke="#111111" /><rect x="147.0" y="216" width="546" height="35" fill="#ffffff" stroke="none" /><text x="420.0" y="242" fill="#111111" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">Xác nhận giỏ, tùy chọn và số điểm muốn dùng</text><line x1="180" y1="256" x2="660" y2="256" stroke="#111111" stroke-width="2" /><polygon points="660,256 647,249 647,263" fill="#111111" stroke="#111111" /><rect x="693.0" y="293" width="414" height="35" fill="#ffffff" stroke="none" /><text x="900.0" y="319" fill="#111111" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">Yêu cầu báo giá (JWT, giỏ, điểm)</text><line x1="660" y1="333" x2="1140" y2="333" stroke="#111111" stroke-width="2" /><polygon points="1140,333 1127,326 1127,340" fill="#111111" stroke="#111111" /><rect x="1230.0" y="370" width="380" height="35" fill="#ffffff" stroke="none" /><text x="1420.0" y="396" fill="#111111" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">Kiểm JWT, quyền Customer</text><line x1="1140" y1="407" x2="1230" y2="407" stroke="#111111" stroke-width="2" /><line x1="1230" y1="407" x2="1230" y2="429" stroke="#111111" stroke-width="2" /><line x1="1230" y1="429" x2="1140" y2="429" stroke="#111111" stroke-width="2" /><polygon points="1140,429 1153,422 1153,436" fill="#111111" stroke="#111111" /><rect x="35" y="457" width="2330" height="1863" fill="none" stroke="#111111" /><rect x="35" y="457" width="2330" height="48" fill="#ffffff" stroke="#111111" /><text x="50" y="489" fill="#111111" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start">alt  [Chưa xác thực / sai quyền]</text><rect x="710.0" y="525" width="38