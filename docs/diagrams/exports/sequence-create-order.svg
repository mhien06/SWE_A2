" x2="1140" y2="875" stroke="#111111" stroke-width="2" /><polygon points="1140,875 1153,868 1153,882" fill="#111111" stroke="#111111" /><rect x="53" y="903" width="2294" height="1389" fill="none" stroke="#111111" /><rect x="53" y="903" width="2294" height="48" fill="#ffffff" stroke="#111111" /><text x="68" y="935" fill="#111111" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start">alt  [Giỏ / điểm sai hoặc nguyên liệu không đủ]</text><rect x="609.0" y="971" width="582" height="35" fill="#ffffff" stroke="none" /><text x="900.0" y="997" fill="#111111" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">Báo lỗi; không tạo Order, không trừ kho / điểm</text><line x1="1140" y1="1011" x2="660" y2="1011" stroke="#111111" stroke-width="2" stroke-dasharray="8 6" /><polygon points="660,1011 673,1004 673,1018" fill="white" stroke="#111111" /><line x1="53" y1="1040" x2="2347" y2="1040" stroke="#111111" stroke-width="2" stroke-dasharray="8 6" /><rect x="54" y="1042" width="2292" height="46" fill="#ffffff" stroke="none" /><text x="68" y="1074" fill="#111111" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start">else  [Hợp lệ]</text><rect x="621.0" y="1108" width="558" height="35" fill="#ffffff" stroke="none" /><text x="900.0" y="1134" fill="#111111" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">Giá chính thức, giảm bằng điểm và tiền VNPay</text><line x1="1140" y1="1148" x2="660" y2="1148" stroke="#111111" stroke-width="2" stroke-dasharray="8 6" /><polygon points="660,1148 673,1141 673,1155" fill="white" stroke="#111111" /><rect x="230.0" y="1185" width="380" height="35" fill="#ffffff" stroke="none" /><text x="420.0" y="1211" fill="#111111" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">Hiển thị giá cuối cùng</text><line x1="660" y1="1225" x2="180" y2="1225" stroke="#111111" stroke-width="2" stroke-dasharray="8 6" /><polygon points="180,1225 193,1218 193,1232" fill="white" stroke="#111111" /><rect x="230.0" y="1262" width="380" height="35" fill="#ffffff" stroke="none" /><text x="420.0" y="1288" fill="#111111" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">Xác nhận giá và tạo đơn</text><line x1="180" y1="1302" x2="660" y2="1302" stroke="#111111" stroke-width="2" /><polygon points="660,1302 647,1295 647,1309" fill="#111111" stroke="#111111" /><rect x="609.0" y="1339" width="582" height="35" fill="#ffffff" stroke="none" /><text x="900.0" y="1365" fill="#111111" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">POST /orders (JWT, giỏ, điểm, giá đã xác nhận)</text><line x1="660" y1="1379" x2="1140" y2="1379" stroke="#111111" stroke-width="2" /><polygon points="1140,1379 1127,1372 1127,1386" fill="#111111" stroke="#111111" /><rect x="1089.0" y="1416" width="582" height="35" fill="#ffffff" stroke="none" /><text x="1380.0" y="1442" fill="#111111" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">BEGIN TX1; khóa số dư điểm, đọc lại giá và kho</text><line x1="1140" y1="1456" x2="1620" y2="1456" stroke="#111111" stroke-width="2" /><polygon points="1620,1456 1607,1449 1607,1463" fill="#111111" stroke="#111111" /><rect x="1129.0" y="1493" width="582" height="35" fill="#ffffff" stroke="none" /><text x="1420.0" y="1519" fill="#111111" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">Kiểm tra lại quyền, dữ liệu và giá đã xác nhận</text><line x1="1140" y1="1530" x2="1230" y2="1530" stroke="#111111" stroke-width="2" /><line x1="1230" y1="1530" x2="1230" y2="1552" stroke="#111111" stroke-width="2" /><line x1="1230" y1="1552" x2="1140" y2="1552" stroke="#111111" stroke-width="2" /><polygon points="1140,1552 1153,1545 1153,1559" fill="#111111" stroke="#111111" /><rect x="71" y="1580" width="2258" height="684" fill="none" stroke="#111111" /><rect x="71" y="1580" width="2258" height="48" fill="#ffffff" stroke="#111111" /><text x="86" y="1612" fill="#111111" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start">alt  [Dữ liệu đã đổi / lỗi transaction]</text><rect x="1190.0" y="1648" width="380" height="35" fill="#ffffff" stroke="none" /><text x="1380.0" y="1674" fill="#111111" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">ROLLBACK TX1</text><line x1="1140" y1="1688" x2="1620" y2="1688" stroke="#111111" stroke-width="2" /><polygon points="1620,1688 1607,1681 1607,1695" fill="#111111" stroke="#111111" /><rect x="573.0" y="1725" width="654" height="35" fill="#ffffff" stroke="none" /><text x="900.0" y="1751" fill="#111111" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">Báo lỗi / yêu cầu xác nhận lại; không có đơn dang dở</text><line x1="1140" y1="1765" x2="660" y2="1765" stroke="#111111" stroke-width="2" stroke-dasharray="8 6" /><polygon points="660,1765 673,1758 673,1772" fill="white" stroke="#111111" /><line x1="71" y1="1794" x2="2329" y2="1794" stroke="#111111" stroke-width="2" stroke-dasharray="8 6" /><rect x="72" y="1796" width="2256" height="46" fill="#ffffff" stroke="none" /><text x="86" y="1828" fill="#111111" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start">else  [Dữ liệu vẫn hợp lệ]</text><rect x="1059.0" y="1862" width="642" height="35" fill="#ffffff" stroke="none" /><text x="1380.0" y="1888" fill="#111111" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">Lưu Order PENDING + OrderItem snapshot; hạn 15 phút</text><line x1="1140" y1="1902" x2="1620" y2="1902" stroke="#111111" stroke-width="2" /><polygon points="1620,1902 1607,1895 1607,1909" fill="#111111" stroke="#111111" /><rect x="89" y="1933" width="2222" height="149" fill="none" stroke="#111111" /><rect x="89" y="1933" width="2222" height="48" fill="#ffffff" stroke="#111111" /><text x="104" y="1965" fill="#111111" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start">opt  [Dùng điểm hợp lệ]</text><rect x="1053.0" y="2001" width="654" height="35" fill="#ffffff" stroke="none" /><text x="1380.0" y="2027" fill="#111111" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">REDEEM + giảm số dư nguyên tử, không dùng vượt số dư</text><line x1="1140" y1="2041" x2="1620" y2="2041" stroke="#111111" stroke-width="2" /><polygon points="1620,2041 1607,2034 1607,2048" fill="#111111" stroke="#111111" /><rect x="1113.0" y="2106" width="534" height="35" fill="#ffffff" stroke="none" /><text x="1380.0" y="2132" fill="#111111" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">COMMIT TX1; không giữ hoặc trừ nguyên liệu</text><line x1="1140" y1="2146" x2="1620" y2="2146" stroke="#111111" stroke-width="2" /><polygon points="1620,2146 1607,2139 1607,2153" fill="#111111" stroke="#111111" /><rect x="657.0" y="2183" width="486" height="35" fill="#ffffff" stroke="none" /><text x="900.0" y="2209" fill="#111111" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">orderId, PENDING, tổng tiền, expiresAt</text><line x1="1140" y1="2223" x2="660" y2="2223" stroke="#111111" stroke-width="2" stroke-dasharray="8 6" /><polygon points="660,2223 673,2216 673,2230" fill="white" stroke="#111111" /><rect x="230.0" y="2344" width="380" height="35" fill="#ffffff" stroke="none" /><text x="420.0" y="2370" fill="#111111" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">Hiển thị kết quả</text><line x1="660" y1="2384" x2="180" y2="2384" stroke="#111111" stroke-width="2" stroke-dasharray="8 6" /><polygon points="180,2384 193,2377 193,2391" fill="white" stroke="#111111" /><rect x="80" y="2417" width="2240" height="50" fill="#ffffff" stroke="#111111" /><text x="96" y="2447" fill="#111111" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start">note: Lỗi bất kỳ lệnh ghi/commit: rollback; không trả kết quả thành công.</text><rect x="80" y="2477" width="2240" height="50" fill="#ffffff" stroke="#111111" /><text x="96" y="2507" fill="#111111" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start">note: Kho lúc tạo chỉ là kiểm tra; khi xác nhận PAID phải kiểm tra lại.</text><rect x="80" y="2537" width="2240" height="50" fill="#ffffff" stroke="#111111" /><text x="96" y="2567" fill="#111111" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start">note: Đề xuất: REDEEM ở TX1; trả lại đúng một lần khi hủy / ngoại lệ kết thúc.</text><text x="1200.0" y="62" fill="#111111" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle">Tạo đơn — kiểm tra dữ liệu và TX1</text></svg>