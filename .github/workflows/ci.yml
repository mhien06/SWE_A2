name: CI

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: brewlite_test
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: brewlite_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brewlite -d brewlite_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://brewlite:brewlite_test_only@localhost:5432/brewlite_test?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: |
          mkdir -p ci-logs
          pnpm install --frozen-lockfile 2>&1 | tee ci-logs/install.log

      - name: Lint Web and API
        run: pnpm lint 2>&1 | tee ci-logs/lint.log

      - name: Unit test Web and API
        run: pnpm test 2>&1 | tee ci-logs/test.log

      - name: Build Web and API
        run: pnpm build 2>&1 | tee ci-logs/build.log

      - name: Inventory integration tests on isolated PostgreSQL
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://brewlite:brewlite_test_only@localhost:5432/brewlite_inventory_test?schema=public
          INVENTORY_TEST_DATABASE_URL: postgresql://brewlite:brewlite_test_only@localhost:5432/brewlite_inventory_test?schema=public
        run: |
          pnpm exec node --input-type=module -e 'import pg from "pg"; const c = new pg.Client({connectionString: process.env.DATABASE_URL.replace("/brewlite_inventory_test", "/postgres")}); await c.connect(); try { await c.query("CREATE DATABASE brewlite_inventory_test"); } finally { await c.end(); }'
          pnpm exec prisma migrate deploy --config prisma7.config.ts
          pnpm test:inventory 2>&1 | tee ../../ci-logs/inventory-test.log

      - name: Task 5.2 PostgreSQL integration and browser E2E (simulated provider)
        working-directory: apps/api
        env:
          TASK52_DATABASE_URL: postgresql://brewlite:brewlite_test_only@localhost:5432/brewlite_task52_test?schema=public
        run: |
          pnpm exec node --input-type=module -e 'import pg from "pg"; const c = new pg.Client({connectionString: process.env.TASK52_DATABASE_URL.replace("/brewlite_task52_test", "/postgres")}); await c.connect(); try { await c.query("CREATE DATABASE brewlite_task52_test"); } finally { await c.end(); }'
          pnpm test:task52:prepare 2>&1 | tee ../../ci-logs/task52-prepare.log
          pnpm exec playwright install --with-deps chromium
          pnpm test:task52 2>&1 | tee ../../ci-logs/task52-test.log

      - name: Upload Task 5.2 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task52-browser-${{ github.run_id }}
          path: tests/artifacts/task52/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ github.run_id }}
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 14
