services:
  - type: web
    name: brewlite-a2-api
    runtime: docker
    plan: free
    region: singapore
    branch: develop
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    autoDeployTrigger: off
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: brewlite-a2-db
          property: connectionString
      - key: WEB_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: PAYMENT_ATTEMPT_TTL_MINUTES
        value: "15"
      - key: VNP_TMN_CODE
        sync: false
      - key: VNP_HASH_SECRET
        sync: false
      - key: VNP_PAY_URL
        value: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
      - key: VNP_API_URL
        value: https://sandbox.vnpayment.vn/merchant_webapi/api/transaction
      - key: VNP_RETURN_URL
        sync: false

databases:
  - name: brewlite-a2-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    databaseName: brewlite
    user: brewlite
    ipAllowList: []
